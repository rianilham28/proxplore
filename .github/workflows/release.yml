name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # btls-sys ships bundled C/C++ (BoringSSL lineage); plain cross-gcc
      # leaves those objects on the host arch ("Relocations in generic ELF
      # (EM: 62)" at link). zig supplies a complete cross C toolchain, so
      # cargo-zigbuild links the whole tree consistently for aarch64-linux.
      - if: ${{ matrix.zigbuild }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: ${{ matrix.zigbuild }}
        run: cargo install cargo-zigbuild --version 0.23 --locked
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} --bin proxplore
        if: ${{ matrix.zigbuild }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin proxplore
        if: ${{ !matrix.zigbuild }}
      - name: Package
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/proxplore"
          strip "$bin" || true
          dist="dist/proxplore-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "$bin" README.md "$dist/"
          tar -C dist -czf "dist/proxplore-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            "$(basename "$dist")"
          sha256sum "dist/proxplore-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            > "dist/proxplore-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Harvester-only build: `proxplore` writes every proxy the 30 keyless
            sources present, deduped, to `proxies.txt`. Reachability checking
            belongs to proxalyze. Checksums in the `.sha256` assets.
